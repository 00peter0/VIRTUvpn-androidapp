name: Android Secured Browser

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-secured-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-leak-gate:
    name: Unit Test, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run secured browser gate
        run: ./gradlew :ui:testVcsinstallUnitTest :ui:lintVcsinstall :ui:assembleVcsinstall

